<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges" width="64" height="64">
  <!-- Pixel Watermelon Icon -->
  <rect width="64" height="64" fill="#131e13"/>
  <!-- Dark green rind -->
  <rect x="8" y="44" width="48" height="8" fill="#1b4d24"/>
  <rect x="12" y="52" width="40" height="4" fill="#0d2b12"/>
  <rect x="4" y="36" width="8" height="12" fill="#1b4d24"/>
  <rect x="52" y="36" width="8" height="12" fill="#1b4d24"/>
  <rect x="4" y="24" width="4" height="12" fill="#1b4d24"/>
  <rect x="56" y="24" width="4" height="12" fill="#1b4d24"/>
  
  <!-- Pale green inner rind -->
  <rect x="8" y="40" width="48" height="4" fill="#78b159"/>
  <rect x="8" y="28" width="4" height="12" fill="#78b159"/>
  <rect x="52" y="28" width="4" height="12" fill="#78b159"/>
  
  <!-- Red melon meat -->
  <rect x="12" y="24" width="40" height="16" fill="#d83a3a"/>
  <rect x="16" y="16" width="32" height="8" fill="#ea4c4c"/>
  <rect x="20" y="8" width="24" height="8" fill="#ea4c4c"/>
  <rect x="24" y="4" width="16" height="4" fill="#ea4c4c"/>
  
  <!-- Black seeds -->
  <rect x="20" y="20" width="4" height="4" fill="#191919"/>
  <rect x="40" y="20" width="4" height="4" fill="#191919"/>
  <rect x="28" y="28" width="4" height="4" fill="#191919"/>
  <rect x="36" y="32" width="4" height="4" fill="#191919"/>
  <rect x="20" y="34" width="4" height="4" fill="#191919"/>
  <rect x="44" y="32" width="4" height="4" fill="#191919"/>
  <rect x="30" y="14" width="4" height="4" fill="#191919"/>
</svg>
